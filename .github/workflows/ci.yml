name: CI

# Se ejecuta en cada push y en cada pull request.
on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pruebas de pensión y de cruces de horario
        run: npm test
